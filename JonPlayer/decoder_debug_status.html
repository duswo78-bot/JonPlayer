    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });
    }

    function render() {
      document.getElementById("lastUpdated").textContent =
        formatDate(META.updatedAt) + " · 빌드: " + META.buildVerified;

      const checks = loadChecks();
      const statusFilter = document.getElementById("filterStatus").value;
      const catFilter = document.getElementById("filterCategory").value;
      const search = document.getElementById("filterSearch").value.toLowerCase();

      const filtered = ISSUES.filter(i => {
        if (statusFilter !== "all" && i.status !== statusFilter) return false;
        if (catFilter !== "all" && i.category !== catFilter) return false;
        if (search && !(i.title + i.desc + (i.note || "")).toLowerCase().includes(search)) return false;
        return true;
      });

      const counts = { done: 0, in_progress: 0, pending: 0, deferred: 0, wontfix: 0 };
      ISSUES.forEach(i => counts[i.status] = (counts[i.status] || 0) + 1);
      const doneCount = counts.done || 0;
      const pct = Math.round((doneCount / ISSUES.length) * 100);

      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="num">${doneCount}/${ISSUES.length}</div><div class="lbl">완료</div></div>
        <div class="stat"><div class="num" style="color:var(--progress)">${counts.in_progress || 0}</div><div class="lbl">진행 중</div></div>
        <div class="stat"><div class="num" style="color:var(--pending)">${counts.pending || 0}</div><div class="lbl">대기</div></div>
        <div class="stat"><div class="num" style="color:var(--deferred)">${counts.deferred || 0}</div><div class="lbl">보류</div></div>
        <div class="stat"><div class="num">${pct}%</div><div class="lbl">진행률</div></div>
        <div class="stat"><div class="num" style="font-size:0.95rem">${META.nextPriority}</div><div class="lbl">다음 우선순위</div></div>
      `;
      document.getElementById("progressLabel").textContent = `진행률 ${pct}% (${doneCount} / ${ISSUES.length} 완료)`;
      document.getElementById("progressFill").style.width = pct + "%";

      const byCat = {};
      filtered.forEach(i => {
        (byCat[i.category] = byCat[i.category] || []).push(i);
      });

      const container = document.getElementById("issueSections");
      container.innerHTML = "";
      Object.keys(byCat).forEach(cat => {
        const sec = document.createElement("section");
        sec.className = "cat";
        sec.innerHTML = `<h2>${cat} (${byCat[cat].length})</h2>`;
        const table = document.createElement("table");
        table.innerHTML = `<thead><tr>
          <th></th><th>#</th><th>상태</th><th>제목</th><th>설명</th><th>우선</th><th>메모</th>
        </tr></thead><tbody></tbody>`;
        const tbody = table.querySelector("tbody");
        byCat[cat].forEach(i => {
          const tr = document.createElement("tr");
          const checked = !!checks[i.id];
          const noteHtml = [
            i.note ? `<div>${i.note}</div>` : "",
            i.fixedIn ? `<div class="note">수정일: ${i.fixedIn}</div>` : ""
          ].join("");
          tr.innerHTML = `
            <td><input type="checkbox" class="check" data-id="${i.id}" ${checked ? "checked" : ""} title="개인 확인용 (localStorage)"></td>
            <td class="id">#${i.id}</td>
            <td><span class="badge ${i.status}">${STATUS_LABEL[i.status] || i.status}</span></td>
            <td><strong>${i.title}</strong></td>
            <td>${i.desc}</td>
            <td class="prio">${i.priority || "—"}</td>
            <td>${noteHtml || '<span class="note">—</span>'}</td>
          `;
          tbody.appendChild(tr);
        });
        sec.appendChild(table);
        container.appendChild(sec);
      });

      container.querySelectorAll(".check").forEach(cb => {
        cb.addEventListener("change", e => {
          const map = loadChecks();
          const id = e.target.dataset.id;
          if (e.target.checked) map[id] = true; else delete map[id];
          saveChecks(map);
        });
      });
    }

    // category filter options
    const catSel = document.getElementById("filterCategory");
    [...new Set(ISSUES.map(i => i.category))].forEach(c => {
      const o = document.createElement("option");
      o.value = c; o.textContent = c;
      catSel.appendChild(o);
    });

    ["filterStatus", "filterCategory", "filterSearch"].forEach(id => {
      document.getElementById(id).addEventListener("input", render);
      document.getElementById(id).addEventListener("change", render);
    });

    render();
  </script>
</body>
</html>
